name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Issues are public.** Please don't include personal data (addresses, e-mail, phone numbers, full logs from other programs). Your call sign is fine if you choose to share it. **Copy diagnostics** in the app already redacts your user name, home folder, IP addresses, PC name and source name. See the [privacy notice](https://reid-n0rc.github.io/n1mm-scope-bridge/privacy.html).
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: "1. "
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the console output, or paste **Copy diagnostics** (already redacted). If you have a short capture (`record`), attach it.
  - type: input
    id: radio
    attributes:
      label: Radio model and firmware version
      placeholder: FT-710, main firmware V01-xx
    validations:
      required: true
  - type: input
    id: n1mm
    attributes:
      label: N1MM Logger+ version
  - type: input
    id: version
    attributes:
      label: n1mm-scope-bridge version or commit
  - type: input
    id: os
    attributes:
      label: OS, Python, and LibFT4222 versions
      placeholder: Windows 11 23H2, Python 3.12, LibFT4222 1.4.8
