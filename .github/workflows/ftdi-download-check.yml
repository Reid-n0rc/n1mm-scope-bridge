# Keeps the installer's FTDI LibFT4222 download healthy (issue #133).
#
# The Windows installer downloads FTDI's signed DLLs at install time from the
# URL pinned in packaging/windows/ftdi_pin.json. This workflow runs
# scripts/check_ftdi_download.py (HTTP 200, exact SHA-256, both DLLs present,
# Authenticode signatures valid) on Windows:
#   - on PRs that touch the pin, the installer, or the check itself;
#   - daily, and on demand.
# Scheduled/on-demand runs open (or update) ONE "FTDI library download is
# broken" issue when the check fails, and close it when the check passes again.
name: FTDI download check

on:
  pull_request:
    branches: [dev, master]
    paths:
      - packaging/windows/ftdi_pin.json
      - packaging/windows/installer.iss
      - packaging/windows/ftdi_install.ps1
      - scripts/check_ftdi_download.py
      - scripts/fetch_ftdi.py
      - .github/workflows/ftdi-download-check.yml
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: FTDI download check (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Check the pinned FTDI download
        id: check
        shell: bash
        run: |
          set -o pipefail
          if uv run --no-project python scripts/check_ftdi_download.py 2>&1 | tee ftdi-check.txt; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ftdi-download-check
          path: ftdi-check.txt
          retention-days: 14

  report:
    name: Open or close the tracking issue
    needs: check
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ftdi-download-check
      - name: Sync the "FTDI library download is broken" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OK: ${{ needs.check.outputs.ok }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          title="FTDI library download is broken"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ "$OK" = "true" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "The FTDI download check passes again ($RUN_URL). Closing."
            fi
            exit 0
          fi
          {
            echo "The scheduled check of the installer's pinned FTDI LibFT4222 download failed: $RUN_URL"
            echo
            echo "Output:"
            echo
            echo '```'
            cat ftdi-check.txt 2>/dev/null || echo "(no output captured; see the run log)"
            echo '```'
            echo
            echo "Fix steps:"
            echo "1. Find the current ft4222 win_amd64 wheel on https://pypi.org/project/ft4222/#files (or FTDI's own package)."
            echo "2. Update url, sha256 (and version) in packaging/windows/ftdi_pin.json, then run python scripts/check_ftdi_download.py on Windows to re-verify the Authenticode signatures."
            echo "3. Open a PR (lane:packaging). The installer, CI and the release regression all read the same pin."
          } > body.md
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --label lane:packaging --body-file body.md
          fi
