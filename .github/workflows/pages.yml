# GitHub Pages site (issue #21): https://reid-n0rc.github.io/n1mm-scope-bridge/
#
# The site always describes the latest *final* release (STYLE.md, Website):
# - a published final release rebuilds the site from that release's tag;
# - before the first release, changes to site/ on dev publish the
#   "in development" site (no downloads, clearly marked);
# - once a release exists, dev pushes do not change the public site;
# - pre-releases (vX.Y.Z-rcN) never change it;
# - workflow_dispatch can rebuild for a given tag (or the latest release).
# The download button links straight to the release's installer asset, taken
# from the release's asset list; a release with no installer yet (one made in
# the web UI, before release.yml attaches it) is skipped, and release.yml
# dispatches this workflow on master once it has published the installer.
#
# Environment rule: the github-pages environment's deployment branches must
# allow `dev` (in-development site), `master` (release.yml's dispatch) and
# `v*` tags (release events). A ref it doesn't allow makes the deploy fail.
name: Pages

on:
  release:
    types: [published]
  push:
    branches: [dev]
    paths:
      - site/**
      - scripts/build_site.py
      - .github/workflows/pages.yml
      # GUI screenshots (#68) are part of the in-development site.
      - src/n1mm_scope_bridge/gui/**
  workflow_dispatch:
    inputs:
      tag:
        description: "Final release tag to publish (vX.Y.Z). Empty: latest release, or the in-development site if there is none."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # the release run's screenshots artifact
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - name: Decide what to publish
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRE: ${{ github.event.release.prerelease }}
          RELEASE_DATE: ${{ github.event.release.published_at }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag=""; date=""; publish=true
          if [ "$EVENT" = "release" ]; then
            if [ "$RELEASE_PRE" = "true" ]; then publish=false; echo "Pre-release: site unchanged."; fi
            tag=$RELEASE_TAG; date=${RELEASE_DATE%%T*}
          else
            if [ -n "$INPUT_TAG" ]; then
              tag=$INPUT_TAG
            else
              # No releases yet: gh exits non-zero (and prints the error JSON), so ignore it.
              tag=$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null) || tag=""
              [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || tag=""
              if [ -n "$tag" ] && [ "$EVENT" = "push" ]; then
                publish=false; echo "A release exists; dev changes publish with the next release."
              fi
            fi
          fi
          if [ -n "$tag" ] && [ "$publish" = "true" ]; then
            gh api "repos/$REPO/releases/tags/$tag" > "$RUNNER_TEMP/release.json"
            [ -n "$date" ] || date=$(jq -r '.published_at[:10]' "$RUNNER_TEMP/release.json")
            installer="n1mm-scope-bridge-setup-${tag#v}.exe"
            if ! jq -e --arg n "$installer" 'any(.assets[]; .name == $n and .state == "uploaded")' \
                "$RUNNER_TEMP/release.json" >/dev/null; then
              publish=false
              echo "$tag has no $installer yet; release.yml rebuilds the site once it publishes it."
            fi
          fi
          {
            echo "publish=$publish"
            echo "tag=$tag"
            echo "date=$date"
          } >> "$GITHUB_OUTPUT"
          echo "publish=$publish tag=${tag:-<in development>} date=$date"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.mode.outputs.publish == 'true'
        with:
          ref: ${{ steps.mode.outputs.tag || github.sha }}
          persist-credentials: false
      # Tags from before the direct download link (#170) have a site builder that
      # can't take the release's asset list; build those with this commit's
      # builder and templates (the user docs still come from the tag).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.mode.outputs.publish == 'true' && steps.mode.outputs.tag != ''
        with:
          path: _builder
          sparse-checkout: |
            scripts
            site
          persist-credentials: false
      - name: Site builder for older tags
        if: steps.mode.outputs.publish == 'true' && steps.mode.outputs.tag != ''
        run: |
          if ! grep -q -- '--release-assets' scripts/build_site.py; then
            echo "This tag's build_site.py predates --release-assets; using $GITHUB_SHA's builder."
            cp _builder/scripts/build_site.py _builder/scripts/site_markdown.py scripts/
            rm -rf site && cp -R _builder/site site
          fi
          rm -rf _builder
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.mode.outputs.publish == 'true'
      # Screenshots (#68): the release workflow's "screenshots-<tag>" run artifact
      # (GUI and installer screenshots from the Windows release regression, #128;
      # releases carry only the installer). If it has expired or is missing, they
      # are generated here from the checked-out code (the release tag, or dev
      # before the first release), without the installer pages.
      - name: Screenshots from the release build
        id: release_shots
        if: steps.mode.outputs.publish == 'true' && steps.mode.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          run=$(gh api "repos/$REPO/actions/artifacts?name=screenshots-$TAG" \
            --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty' 2>/dev/null) || run=""
          if [ -n "$run" ] && gh run download "$run" -R "$REPO" -n "screenshots-$TAG" -D _shots; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Screenshots from release run $run."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No screenshots-$TAG artifact; generating from the tag."
          fi
      - name: Qt runtime libraries
        if: steps.mode.outputs.publish == 'true' && steps.release_shots.outputs.found != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Generate screenshots
        if: steps.mode.outputs.publish == 'true' && steps.release_shots.outputs.found != 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --python 3.13 n1mm-scope-bridge gui --screenshot _shots
      - name: Build
        if: steps.mode.outputs.publish == 'true'
        env:
          TAG: ${{ steps.mode.outputs.tag }}
          DATE: ${{ steps.mode.outputs.date }}
        run: |
          if [ -n "$TAG" ]; then
            uv run --no-project --python 3.13 python scripts/build_site.py --out _site --screenshots _shots --tag "$TAG" --release-date "$DATE" --release-assets "$RUNNER_TEMP/release.json"
          else
            uv run --no-project --python 3.13 python scripts/build_site.py --out _site --screenshots _shots
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.mode.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.mode.outputs.publish == 'true'
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
