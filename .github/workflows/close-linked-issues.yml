# Closes a PR's linked issues when it merges into dev (#220). GitHub closes
# `Closes #n` issues only on a merge into the default branch (master), so
# finished issues would otherwise stay open until a release.
# GitHub also leaves closingIssuesReferences empty for PRs into dev, so the
# script parses the closing keywords from the PR body itself (#250).
# Logic: scripts/close_linked_issues.py.
#
# pull_request_target (not pull_request) so a fork PR's merge can still write
# issues. It is safe here: the job checks out only the base branch (dev) for
# the script, never the PR head, and passes the PR number through env:.
name: Close linked issues

on:
  pull_request_target:
    types: [closed]
    branches: [dev]

permissions: {}

concurrency:
  group: close-linked-issues-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  close:
    name: Close linked issues
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the base branch for the script
      pull-requests: read # read the merged PR (state, base, author, body, last edit)
      issues: write # read issues and timelines, close them and comment
    steps:
      # Base branch only. Never check out or run the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: dev
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Close linked issues
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python scripts/close_linked_issues.py "$PR_NUMBER" "$REPO"
