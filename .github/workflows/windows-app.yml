# Builds the Windows application with PyInstaller and smoke-tests the built
# exe (legal notices, emulator frames into a UDP listener). Issue #6.
# One build per architecture (#149), each on a runner that runs it natively:
# x64 and 32-bit x86 (command line only; Qt 6 has no 32-bit build) on
# windows-latest, native ARM64 on windows-11-arm. Artifacts: windows-app-<arch>.
#
# Called by the release workflow (#46) and the installer build (#20) through
# workflow_call; runs on its own for PRs that can change the app.
#
# Security (#211): inputs.ref must only ever be a trusted commit. Today that is
# release.yml's commit, verified to be on master. Callers must not use
# privileged triggers (pull_request_target, workflow_run, issue_comment) or
# `secrets: inherit`. The "Guard: only trusted refs" step enforces the ref and
# trigger rules before each checkout.
name: Windows app

on:
  pull_request:
    branches: [dev, master]
    paths:
      - src/**
      - packaging/**
      - scripts/build_windows_app.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/windows-app.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit or tag to build (default: the triggering commit)"
        type: string
        default: ""
      version:
        description: "Release version to stamp into the build (default: as committed)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # github.workflow is the caller when reused, so callers never cancel each other.
  group: windows-app-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows app (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: windows-latest, python: "3.13", sync: "--group packaging", gui: auto }
          - { arch: arm64, os: windows-11-arm, python: "3.13", sync: "--group packaging", gui: auto }
          - arch: x86
            os: windows-latest
            python: cpython-3.13-windows-x86
            sync: "--group packaging --no-group gui-dev"
            gui: "off"
    steps:
      - name: "Guard: only trusted refs"
        # Fails closed before checking out inputs.ref (#211, CodeQL #37-#40).
        # Never echoes the ref: it could carry workflow commands.
        shell: bash
        env:
          REF: ${{ inputs.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request_target | workflow_run | issue_comment)
              echo "::error::Refusing to build under the privileged trigger $EVENT."
              exit 1
              ;;
          esac
          if [ -n "$REF" ] && ! [[ "$REF" =~ ^[0-9a-f]{40}$ || "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::Refusing untrusted ref. inputs.ref must be a 40-character commit SHA or a vX.Y.Z[-rcN] tag."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Stamp the release version (release builds only)
        # Mirrors scripts/release_notes.py stamp_version (tested there). Inline so it
        # also works when rebuilding an older tag whose scripts predate it.
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          py=$(command -v python3 || command -v python)
          "$py" - <<'PY'
          import os, pathlib, re
          v = os.environ["VERSION"]
          for rel, pat in (("pyproject.toml", r'(?m)^(version\s*=\s*")[^"]+(")'),
                           ("src/n1mm_scope_bridge/__init__.py", r'(?m)^(__version__\s*=\s*")[^"]+(")'),
                           ("uv.lock", r'(?m)^(name = "n1mm-scope-bridge"\nversion = ")[^"]+(")')):
              p = pathlib.Path(rel)
              t, n = re.subn(pat, r"\g<1>" + v + r"\g<2>", p.read_text(encoding="utf-8"), count=1)
              if n != 1:
                  raise SystemExit(f"no version found in {rel}")
              p.write_text(t, encoding="utf-8")
          print("stamped", v)
          PY
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked ${{ matrix.sync }}
      - name: Build and smoke-test the app
        shell: bash
        run: |
          set -o pipefail
          uv run --no-sync python -c "import sysconfig; print('Python platform:', sysconfig.get_platform())"
          uv run --no-sync python scripts/build_windows_app.py --gui ${{ matrix.gui }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-app-${{ matrix.arch }}
          path: dist/windows/*.zip
          if-no-files-found: error
          retention-days: 30
