# Builds the Windows installer (Inno Setup) around the PyInstaller apps and runs
# the silent install -> run -> uninstall smoke test on clean runners. Issue #20.
# One installer holds the x64, native ARM64 and 32-bit x86 apps (#149); it is
# smoke-tested on windows-latest (default x64 payload, and x86 forced with
# /PAYLOAD) and on windows-11-arm (default x64 payload, emulated, and arm64).
#
# Inno Setup is downloaded from its official GitHub release and pinned by
# SHA-256. FTDI's LibFT4222 is never bundled.
#
# Security (#211): inputs.ref must only ever be a trusted commit. Today that is
# release.yml's commit, verified to be on master. Callers must not use
# privileged triggers (pull_request_target, workflow_run, issue_comment) or
# `secrets: inherit`. The "Guard: only trusted refs" step enforces the ref and
# trigger rules before each checkout.
name: Windows installer

on:
  pull_request:
    branches: [dev, master]
    paths:
      - packaging/**
      - scripts/build_windows_app.py
      - scripts/build_installer.py
      - src/n1mm_scope_bridge/gui/**
      - .github/workflows/windows-installer.yml
      - .github/workflows/windows-app.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit or tag to build (default: the triggering commit)"
        type: string
        default: ""
      version:
        description: "Release version to stamp into the build (default: as committed)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe
  INNO_SHA256: 0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f

jobs:
  app:
    uses: ./.github/workflows/windows-app.yml
    with:
      ref: ${{ inputs.ref }}
      version: ${{ inputs.version }}

  installer:
    name: Build installer
    needs: app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: "Guard: only trusted refs"
        # Fails closed before checking out inputs.ref (#211, CodeQL #37-#40).
        # Never echoes the ref: it could carry workflow commands.
        shell: bash
        env:
          REF: ${{ inputs.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request_target | workflow_run | issue_comment)
              echo "::error::Refusing to build under the privileged trigger $EVENT."
              exit 1
              ;;
          esac
          if [ -n "$REF" ] && ! [[ "$REF" =~ ^[0-9a-f]{40}$ || "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::Refusing untrusted ref. inputs.ref must be a 40-character commit SHA or a vX.Y.Z[-rcN] tag."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Stamp the release version (release builds only)
        # Mirrors scripts/release_notes.py stamp_version (tested there). Inline so it
        # also works when rebuilding an older tag whose scripts predate it.
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          py=$(command -v python3 || command -v python)
          "$py" - <<'PY'
          import os, pathlib, re
          v = os.environ["VERSION"]
          for rel, pat in (("pyproject.toml", r'(?m)^(version\s*=\s*")[^"]+(")'),
                           ("src/n1mm_scope_bridge/__init__.py", r'(?m)^(__version__\s*=\s*")[^"]+(")'),
                           ("uv.lock", r'(?m)^(name = "n1mm-scope-bridge"\nversion = ")[^"]+(")')):
              p = pathlib.Path(rel)
              t, n = re.subn(pat, r"\g<1>" + v + r"\g<2>", p.read_text(encoding="utf-8"), count=1)
              if n != 1:
                  raise SystemExit(f"no version found in {rel}")
              p.write_text(t, encoding="utf-8")
          print("stamped", v)
          PY
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-app-*
          path: dist/apps
      - name: Unpack the apps
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'arm64', 'x86') {
            Get-ChildItem "dist/apps/windows-app-$arch/*.zip" | ForEach-Object { Expand-Archive $_ -DestinationPath "dist/apps/$arch" -Force }
          }
      - name: Install Inno Setup (pinned)
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup checksum mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          $p = Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',"/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed: $($p.ExitCode)" }
          "ISCC=$dir\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build installer (all architectures)
        shell: bash
        run: |
          set -o pipefail
          uv run --no-project python scripts/build_installer.py --require-all \
            --app-dir dist/apps/x64/n1mm-scope-bridge \
            --app-arm64 dist/apps/arm64/n1mm-scope-bridge \
            --app-x86 dist/apps/x86/n1mm-scope-bridge
          # The glob matches our own installer names; ls -l is for the summary.
          # shellcheck disable=SC2012
          ls -l dist/windows/n1mm-scope-bridge-setup-*.exe | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: dist/windows/n1mm-scope-bridge-setup-*.exe
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: Installer smoke test (${{ matrix.os }}, ${{ matrix.payload || 'default' }} payload)
    needs: installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, payload: "" }
          - { os: windows-latest, payload: x86 }
          - { os: windows-11-arm, payload: "" }
          - { os: windows-11-arm, payload: arm64 }
    steps:
      - name: "Guard: only trusted refs"
        # Fails closed before checking out inputs.ref (#211, CodeQL #37-#40).
        # Never echoes the ref: it could carry workflow commands.
        shell: bash
        env:
          REF: ${{ inputs.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request_target | workflow_run | issue_comment)
              echo "::error::Refusing to build under the privileged trigger $EVENT."
              exit 1
              ;;
          esac
          if [ -n "$REF" ] && ! [[ "$REF" =~ ^[0-9a-f]{40}$ || "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::Refusing untrusted ref. inputs.ref must be a 40-character commit SHA or a vX.Y.Z[-rcN] tag."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Stamp the release version (release builds only)
        # Mirrors scripts/release_notes.py stamp_version (tested there). Inline so it
        # also works when rebuilding an older tag whose scripts predate it.
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          py=$(command -v python3 || command -v python)
          "$py" - <<'PY'
          import os, pathlib, re
          v = os.environ["VERSION"]
          for rel, pat in (("pyproject.toml", r'(?m)^(version\s*=\s*")[^"]+(")'),
                           ("src/n1mm_scope_bridge/__init__.py", r'(?m)^(__version__\s*=\s*")[^"]+(")'),
                           ("uv.lock", r'(?m)^(name = "n1mm-scope-bridge"\nversion = ")[^"]+(")')):
              p = pathlib.Path(rel)
              t, n = re.subn(pat, r"\g<1>" + v + r"\g<2>", p.read_text(encoding="utf-8"), count=1)
              if n != 1:
                  raise SystemExit(f"no version found in {rel}")
              p.write_text(t, encoding="utf-8")
          print("stamped", v)
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: dist/windows
      - name: Smoke test (install, run, uninstall)
        shell: pwsh
        env:
          PAYLOAD: ${{ matrix.payload }}
        run: ./packaging/windows/smoke_test.ps1 -Installer (Get-ChildItem dist/windows/n1mm-scope-bridge-setup-*.exe).FullName -Payload $env:PAYLOAD -JUnit installer-junit.xml
      # Every smoke check as a JUnit testcase in Codecov Test Analytics (#182),
      # also when the smoke test fails. Never fails the job. Skipped when
      # release.yml calls this workflow (no secrets are passed to it).
      - name: Check Codecov token
        if: ${{ !cancelled() && github.workflow == 'Windows installer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: bash
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "::warning::CODECOV_TOKEN is empty — installer test results won't upload. Set it with 'gh secret set CODECOV_TOKEN' in a terminal."
          fi
      - name: Upload smoke test results to Codecov
        if: ${{ !cancelled() && github.workflow == 'Windows installer' && hashFiles('installer-junit.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: installer-junit.xml
          disable_search: true
          flags: installer
          fail_ci_if_error: false
