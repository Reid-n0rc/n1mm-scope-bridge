# Full release regression (issue #16). Must pass before any release candidate
# (vX.Y.Z-rcN) or release (vX.Y.Z) ships. Runs on release PRs (dev -> master),
# on release tags, and on demand. Logic: scripts/release_regression.py.
#
# Windows is the product platform (N1MM+ is Windows-only): the Windows jobs
# run every step, including the app, GUI, and installer steps. The Ubuntu job
# keeps the code portable and skips the Windows-only steps.
name: Release regression

on:
  pull_request:
    branches: [master]
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: release-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    name: Release regression (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.13", flags: "" }
          - { os: windows-latest, python: "3.14t", flags: "--skip-gui" }
          - { os: ubuntu-latest, python: "3.13", flags: "--skip-windows-only" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install Inno Setup 7.1.0 (pinned, for the installer step)
        if: runner.os == 'Windows' && !contains(matrix.flags, '--skip-gui')
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') { throw "Inno Setup checksum mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          $p = Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',"/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed: $($p.ExitCode)" }
          "ISCC=$dir\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run full regression
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          uv run --no-project python scripts/release_regression.py
          --report regression-report.md ${{ matrix.flags }}
      - name: Publish report to the job summary
        if: always()
        shell: bash
        run: cat regression-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: regression-${{ matrix.os }}-${{ matrix.python }}
          path: |
            regression-report.md
            dist/regression/
          if-no-files-found: warn
          retention-days: 90
