# CI: lint, type check, and test on every PR into dev/master, plus hook tests,
# a package build, and a secret scan.
#
# Release PRs (dev -> master) run the same jobs from a locked, clean
# environment, which is the full regression required by AGENTS.md.
# No secrets are used. Tests never need a radio, FTDI libraries, or N1MM+.
# Actions are pinned to commit SHAs; Dependabot keeps them current.
name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is where N1MM+ runs, so it is a first-class target.
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
        include:
          # Free-threaded CPython (no GIL): the pipeline's stages and radios
          # run truly in parallel here, so race conditions surface (issue #8).
          - os: ubuntu-latest
            python: "3.14t"
          - os: windows-latest
            python: "3.14t"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      # MSVC for the mock FTDI library used by the native tests (#37).
      - name: MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      # PySide6 has no wheels for free-threaded Python; GUI tests skip there.
      - run: uv sync --locked ${{ endsWith(matrix.python, 't') && '--no-group gui-dev' || '' }}
      - run: uv run ${{ endsWith(matrix.python, 't') && '--no-group gui-dev' || '' }} pytest --cov --cov-report=term-missing --cov-report=xml ${{ endsWith(matrix.python, 't') && '--cov-config=.coveragerc-nogui' || '' }}
        env:
          QT_QPA_PLATFORM: offscreen
          # Native tests must run in CI, never silently skip (#37).
          N1MM_REQUIRE_NATIVE: "1"
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Repository secret only; fork PRs have no secrets and skip the upload.
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: ${{ runner.os }}-${{ matrix.python }}
          fail_ci_if_error: false

  hooks:
    name: Git and agent hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh tests/hooks/run.sh
      - run: HOOK_SHELL=dash sh tests/hooks/run.sh

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits via the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
