# CI: lint, type check, and test on every PR into dev/master, plus hook tests,
# a package build, and a secret scan.
#
# Release PRs (dev -> master) run the same jobs from a locked, clean
# environment, which is the full regression required by AGENTS.md.
# No secrets are used. Tests never need a radio, FTDI libraries, or N1MM+.
# Actions are pinned to commit SHAs; Dependabot keeps them current.
name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.label || matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the product platform (N1MM+ is Windows-only): it runs every
        # supported Python and those jobs are required checks (#15). Ubuntu keeps
        # the code portable; one macOS job catches platform assumptions.
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
          # Free-threaded CPython (no GIL): the pipeline's stages and radios
          # run truly in parallel here, so race conditions surface (issue #8).
          - os: ubuntu-latest
            python: "3.14t"
          - os: windows-latest
            python: "3.14t"
          # Windows on ARM, native ARM64 Python (#149). The FTDI DLLs are amd64
          # (no verifiable ARM64 source yet), so the native tests check the clear
          # architecture-mismatch error; ARM64 PCs run the x64 app (emulated).
          - os: windows-11-arm
            python: "3.13"
            ftdi_arch: amd64
          # 32-bit x86 Python on x64 Windows (#149): core + CLI only, because
          # Qt 6 has no 32-bit Windows build. Real i386 FTDI DLLs.
          - os: windows-latest
            python: cpython-3.13-windows-x86
            label: 3.13-x86
            ftdi_arch: i386
            nogui: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      # FTDI's real LibFT4222/D2XX DLLs for the native tests (#37). CI-only download,
      # hash-pinned in scripts/fetch_ftdi.py; never committed or bundled.
      - name: Cache FTDI download (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ftdi/downloads
          key: ftdi-${{ matrix.ftdi_arch || 'amd64' }}-${{ hashFiles('scripts/fetch_ftdi.py', 'packaging/windows/ftdi_pin.json') }}
      - name: FTDI LibFT4222 + D2XX (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/fetch_ftdi.py --dest "$RUNNER_TEMP/ftdi" --arch "${{ matrix.ftdi_arch || 'amd64' }}"
      # No GUI (PySide6) on free-threaded Python (abi3 wheels only) or 32-bit x86 (no Qt 6).
      - run: uv sync --locked ${{ (endsWith(matrix.python, 't') || matrix.nogui) && '--no-group gui-dev' || '' }}
      # junit.xml feeds Codecov Test Analytics (#171); legacy family = readable test names.
      - run: uv run ${{ (endsWith(matrix.python, 't') || matrix.nogui) && '--no-group gui-dev' || '' }} pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml -o junit_family=legacy ${{ (endsWith(matrix.python, 't') || matrix.nogui) && '--cov-config=.coveragerc-nogui' || '' }}
        env:
          QT_QPA_PLATFORM: offscreen
      # Per-area floors (app 90%, scripts ratchet), replacing coverage's single fail_under (#180).
      - name: Coverage gate
        run: uv run ${{ (endsWith(matrix.python, 't') || matrix.nogui) && '--no-group gui-dev' || '' }} python scripts/coverage_gate.py ${{ (endsWith(matrix.python, 't') || matrix.nogui) && '--config .coveragerc-nogui' || '' }}
      # An empty CODECOV_TOKEN made every upload fail silently for a day (#171).
      # Warn loudly, but never fail CI. Fork PRs get no secrets, so skip them.
      - name: Check Codecov token
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: bash
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "::warning::CODECOV_TOKEN is empty — coverage/test results won't upload. Set it with 'gh secret set CODECOV_TOKEN' in a terminal."
          fi
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Repository secret only; fork PRs have no secrets and skip the upload.
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          flags: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.label || matrix.python }}
          fail_ci_if_error: false
      # Upload even when tests fail, so Codecov sees the failures.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          disable_search: true
          flags: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.label || matrix.python }}
          fail_ci_if_error: false

  hooks:
    name: Git and agent hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh tests/hooks/run.sh
      - run: HOOK_SHELL=dash sh tests/hooks/run.sh

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: Dependency review
    # Blocks PRs that add dependencies with known vulnerabilities (moderate or
    # worse) or incompatible licenses. The merge gate (scripts/ready_to_merge.py)
    # requires it to pass.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # summary comment on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits via the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
