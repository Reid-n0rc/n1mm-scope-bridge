# Enforces the AGENTS.md issue policy: every PR into dev must close an issue
# that has the `plan-approved` label and is assigned to whoever did the work.
# Release PRs (dev -> master) are exempt. Logic: scripts/check_issue_policy.py.
#
# Uses pull_request_target so the workflow and script always come from the
# base branch, which means a PR cannot weaken the check by editing it. This is
# safe because no PR code is checked out or executed: the PR body is only read
# from the event payload file and matched with a regex. The token is read-only.
#
# Assigning or approving an issue does not re-trigger this check. Edit the PR,
# push a commit, or re-run the job after fixing the issue. The script re-reads
# the PR through the API, so a re-run sees the current body.
#
# Bot PRs (#224, for example the Claude Code Action pilot) also need an
# approving review from @Reid-n0rc on the current head, and a `plan-approved`
# label added by a bot other than github-actions[bot] does not count. Approving
# the PR does not re-run this check either: re-run the job. There is
# deliberately no pull_request_review trigger, because that event runs the
# workflow file from the PR, which would let a PR rewrite the check it is
# judged by.
#
# workflow_dispatch (with the PR number) is used by the Copilot Autofix
# conformance workflow (#83): dispatched on the PR branch so the check run
# attaches to the PR's head commit. The script still comes from `dev`.
#
# merge_group (#216): the merge queue needs this check on its
# gh-readonly-queue/dev/pr-<n>-<sha> commit. The PR number is parsed from that
# ref, and the checkout is the queue's base commit, never the queue commit.
name: Issue policy

on:
  pull_request_target:
    branches: [dev, master]
    types: [opened, edited, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to check
        required: true
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  issue-policy:
    name: Linked issue approved and assigned
    runs-on: ubuntu-latest
    steps:
      # Base branch only. Never check out the PR head here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && 'dev' || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: PR number from the merge queue ref
        id: queue
        if: github.event_name == 'merge_group'
        env:
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          # refs/heads/gh-readonly-queue/dev/pr-<n>-<sha> -> <n>
          n="${QUEUE_REF##*/pr-}"
          echo "pr=${n%%-*}" >> "$GITHUB_OUTPUT"
      - name: Check linked issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr || steps.queue.outputs.pr }}
        run: python scripts/check_issue_policy.py
